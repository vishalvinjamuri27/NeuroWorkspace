{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "neuroworkspace.serviceAccountName" . }}
  labels:
    {{- include "neuroworkspace.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC bindings: the app never calls the Kubernetes API, so this
# ServiceAccount exists only to disable the default one's auto-mounted
# token via automountServiceAccountToken below, not to grant permissions.
automountServiceAccountToken: false
{{- end }}
