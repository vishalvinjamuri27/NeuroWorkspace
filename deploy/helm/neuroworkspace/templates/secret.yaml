{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels:
    {{- include "neuroworkspace.labels" . | nindent 4 }}
  annotations:
    # Same class of bug as serviceaccount.yaml/migration-job.yaml: a
    # pre-install Helm hook (the migration Job) runs before any of the
    # chart's ordinary resources exist, so on a clean cluster the
    # migration Job's env (sourced from this Secret) failed with "secret
    # ... not found" -- found by actually running `helm install` against
    # a real kind cluster. Unlike the ServiceAccount, the migration Job
    # genuinely needs these values (DATABASE_URL etc.), so it cannot just
    # drop the dependency; instead this Secret is hooked at an earlier
    # weight than the migration Job's "0" so it exists first on install.
    # pre-install ONLY, deliberately not pre-upgrade -- see
    # dev-postgres.yaml for why adding pre-upgrade to a
    # before-hook-creation resource is not free (it was tried here too and
    # is unnecessary: the Secret already exists from install and does not
    # need to be re-created for the pre-upgrade migration Job to read it).
    # Not deleted on `helm uninstall` (Helm does not garbage-collect
    # hook-only resources the way it does ordinary ones) -- acceptable for
    # this dev/local-cluster secret, but worth knowing if this chart is
    # ever pointed at a namespace that gets reused across
    # install/uninstall cycles.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- /*
  values-dev.yaml's databaseUrl/redisUrl hardcode hostnames like
  "neuroworkspace-postgres", which only resolve if this chart is
  installed with `--name neuroworkspace` -- docs/KUBERNETES.md's own
  documented command (`helm install nw ...`) uses a different release
  name and produces Services named "nw-postgres"/"nw-redis" instead,
  which silently do not match. Found by actually running the documented
  install command against a real kind cluster: the migration Job's
  database-connectivity init-container hung retrying a hostname that
  could never resolve. When the bundled dev dependencies are enabled,
  compute the actual hostnames from this release's real fullname instead
  of trusting the static string in values-dev.yaml.
  */}}
  {{- if .Values.devDependencies.enabled }}
  DATABASE_URL: {{ printf "postgresql+psycopg://neuroworkspace:neuroworkspace@%s-postgres:5432/neuroworkspace" (include "neuroworkspace.fullname" .) | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:6379/0" (include "neuroworkspace.fullname" .) | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.secrets.dev.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.dev.redisUrl | quote }}
  {{- end }}
  SESSION_SECRET: {{ .Values.secrets.dev.sessionSecret | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.dev.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.dev.s3SecretKey | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.dev.oidcClientSecret | quote }}
{{- end }}
