{{- if .Values.devDependencies.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neuroworkspace.fullname" . }}-redis
  labels:
    {{- include "neuroworkspace.labels" . | nindent 4 }}
  annotations:
    # Same reasoning as dev-postgres.yaml, including pre-install-only (not
    # pre-upgrade) to avoid wiping this emptyDir on every upgrade.
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "neuroworkspace.selectorLabels" (dict "component" "dev-redis" "Release" .Release "Chart" .Chart) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "neuroworkspace.selectorLabels" (dict "component" "dev-redis" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:8.4-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neuroworkspace.fullname" . }}-redis
  labels:
    {{- include "neuroworkspace.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  selector:
    {{- include "neuroworkspace.selectorLabels" (dict "component" "dev-redis" "Release" .Release "Chart" .Chart) | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
{{- end }}
