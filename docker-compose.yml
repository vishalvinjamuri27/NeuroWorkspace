name: neuroworkspace
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: neuroworkspace
      POSTGRES_USER: neuroworkspace
      POSTGRES_PASSWORD: neuroworkspace
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroworkspace"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-neuroworkspace}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-in-non-local-environments}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_public_sample.py"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes:
      - canonical-data:/data/objects/canonical
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    volumes:
      - canonical-data:/data/objects/canonical
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    volumes:
      - canonical-data:/data/objects/canonical

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  canonical-data:
