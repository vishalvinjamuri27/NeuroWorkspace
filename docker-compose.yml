name: neuroworkspace
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: neuroworkspace
      POSTGRES_USER: neuroworkspace
      POSTGRES_PASSWORD: neuroworkspace
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroworkspace"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO stopped publishing images to Docker Hub/Quay; Chainguard's build is
    # the maintained public one (free tier is `latest` only, so pin the digest).
    image: cgr.dev/chainguard/minio:latest@sha256:73297936408b731668ca0e835ac9add1a35cb6026a125c2f0cd476d9ef48222c
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-neuroworkspace}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-in-non-local-environments}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # api, worker, worker-beat, and bootstrap intentionally mount no shared
  # volume for canonical signal data: with OBJECT_STORE_BACKEND=s3 (this
  # stack's default), neuro_workspace.signal_store.create_signal_store
  # returns an S3ZarrSignalStore that reads/writes canonical Zarr arrays
  # directly against MinIO over HTTP. Every replica of every service talks to
  # the same bucket independently, so this stack scales api/worker
  # horizontally with `docker compose up --scale api=N --scale worker=M`
  # without provisioning a network filesystem.
  bootstrap:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed_public_sample.py"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }

  # A single scheduler process, not one per worker replica: it is the
  # transactional-outbox dispatcher and lease-reclaim sweep (see
  # neuro_worker.celery_app.reclaim_jobs / services.jobs.run_dispatch_sweep).
  # Running it here instead of embedding `-B` in every worker keeps the sweep
  # from firing N times as `worker` is scaled horizontally.
  worker-beat:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    command: ["celery", "-A", "neuro_worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }

  # Opt-in: `docker compose --profile observability up` also brings up
  # Prometheus scraping the API's /metrics (see
  # neuro_workspace.metrics). There is no Grafana dashboard checked in --
  # shipping unverified panel JSON is worse than none; point Grafana or any
  # other Prometheus-compatible viewer at this datasource and build one
  # against real metric names once the stack has real traffic.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
