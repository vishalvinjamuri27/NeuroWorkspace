name: Feature request
description: Describe a validated workflow need or engineering improvement
title: "proposal: "
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence level
      options: [Validated user need, Repeated pain point, Engineering improvement, Speculative idea]
    validations: { required: true }
  - type: textarea
    id: workflow
    attributes:
      label: Current workflow and pain
      description: Who encounters this, what are they trying to do, and what currently fails?
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe success without prescribing an implementation.
    validations: { required: true }
  - type: textarea
    id: constraints
    attributes:
      label: Scientific, privacy, and compatibility constraints
