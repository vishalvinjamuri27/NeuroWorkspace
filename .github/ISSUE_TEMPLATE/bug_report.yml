name: Bug report
description: Report a reproducible product or scientific-correctness problem
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not attach private recordings or identifiable subject metadata.
  - type: textarea
    id: impact
    attributes:
      label: What happened?
      description: Include the expected result and user impact.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using public or generated data.
    validations: { required: true }
  - type: dropdown
    id: format
    attributes:
      label: Recording format
      options: [Not format-specific, EDF or EDF+, BioSemi BDF, BrainVision, EEGLAB, FIF, CSV or TSV, BIDS]
  - type: input
    id: version
    attributes:
      label: NeuroWorkspace version or commit
    validations: { required: true }
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, deployment method, and non-secret configuration.
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, private recordings, and identifying subject information.
          required: true
