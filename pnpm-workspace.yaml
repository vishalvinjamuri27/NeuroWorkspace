packages:
  - apps/web
  - packages/shared-types

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Security floors for transitive dependencies whose parents still pin
# vulnerable ranges; each stays within the major its parent expects.
overrides:
  "brace-expansion@^1": ^1.1.21
  "brace-expansion@^2": ^2.1.7
  "brace-expansion@^5": ^5.0.12
  "js-yaml@^4": ^4.3.2
  "source-map-js@^1": ^1.2.2
  "vite@^7": ^7.3.7
  "zod@^4": ^4.6.7
